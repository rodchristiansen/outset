name: Managed State Keeper

on:
  pull_request:
    paths:
      - 'ManagedStateKeeper/**'
      - '.github/workflows/managed-state-keeper.yml'
  push:
    branches: [main]
    paths:
      - 'ManagedStateKeeper/**'

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ManagedStateKeeper
    steps:
      - uses: actions/checkout@v4
      - name: Test and build the app bundle
        run: |
          set -euo pipefail
          # Link against a macOS 26 SDK, as BootstrapMate's release does, so the
          # window gets the macOS 26 toolbar tabs rather than the older title bar.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          xcrun --show-sdk-version
          swift test
          # The bundle ships inside the outset package; there is no package of its own.
          make app
