name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The bundle carries the tag as its version so the installer replaces an
      # older Outset.app, including upstream builds, instead of skipping it.
      - name: Build Outset.app (unsigned)
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          xcodebuild -project Outset.xcodeproj -scheme "Outset App Bundle" -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" \
            clean build
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/Build/Products/Release/Outset.app/Contents/Info.plist \
            | grep -qx "$VERSION"

      - name: Build Managed State Keeper.app (unsigned)
        working-directory: ManagedStateKeeper
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          # Link against a macOS 26 SDK, as BootstrapMate's release does, so the
          # window gets the macOS 26 toolbar tabs rather than the older title bar.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          xcrun --show-sdk-version
          make app VERSION="$VERSION"

      # One package carries outset and its window, so every Mac that gets
      # outset also gets Managed State Keeper and its helper.
      - name: Build unsigned package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          Package/buildReleasePackage.zsh "$VERSION" \
            build/Build/Products/Release/Outset.app \
            "ManagedStateKeeper/build/pkg-root/Applications/Utilities/Managed State Keeper.app" \
            artifacts
          pkgutil --payload-files "artifacts/Outset-${VERSION}.pkg" \
            | grep -x "./Applications/Utilities/Managed State Keeper.app/Contents/MacOS/ManagedStateKeeperHelper" >/dev/null
          shasum -a 256 "artifacts/Outset-${VERSION}.pkg" > "artifacts/Outset-${VERSION}.pkg.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Outset ${{ steps.ver.outputs.VERSION }}
          body: Unsigned package built from this tag. It installs outset and the Managed State Keeper window with its helper. Sign and notarize it with your own Developer ID before deployment; the Managed State Keeper helper refuses every client until it is signed.
          files: |
            artifacts/Outset-${{ steps.ver.outputs.VERSION }}.pkg
            artifacts/Outset-${{ steps.ver.outputs.VERSION }}.pkg.sha256
