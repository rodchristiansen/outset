name: Build Outset Release (Manual)

env:
  NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD_MAOS }}

on: [workflow_dispatch]

jobs:
  build:
    runs-on: xcode-27

    steps:
    - name: Checkout outset repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    # Every macOS job builds with Xcode 27, which the app icons need: an older
    # actool drops their light and dark appearances. The xcode-27 image ships
    # it; stop here if it is gone rather than build with another Xcode.
    - name: Select Xcode 27
      working-directory: .
      run: |
        set -euo pipefail
        XCODE=/Applications/Xcode_27.app
        if [ ! -d "$XCODE" ]; then
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
        fi
        if [ -z "$XCODE" ] || [ ! -d "$XCODE" ]; then
          echo "::error::Xcode 27 is not installed on this runner. Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
          exit 1
        fi
        sudo xcode-select -s "$XCODE/Contents/Developer"
        echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
        xcodebuild -version
        xcrun --show-sdk-version

    - name: Install Apple Xcode certificates
      uses: apple-actions/import-codesign-certs@v3
      with:
        keychain-password: ${{ github.run_id }}
        p12-file-base64: ${{ secrets.APP_CERTIFICATES_P12_MAOS }}
        p12-password: ${{ secrets.APP_CERTIFICATES_P12_PASSWORD_MAOS }}

    - name: Install Apple Installer certificates
      uses: apple-actions/import-codesign-certs@v3
      with:
        create-keychain: false # do not create a new keychain for this value
        keychain-password: ${{ github.run_id }}
        p12-file-base64: ${{ secrets.PKG_CERTIFICATES_P12_MAOS }}
        p12-password: ${{ secrets.PKG_CERTIFICATES_P12_PASSWORD_MAOS }}

    - name: Run build package script
      run: ./build_outset.zsh "CREATE_PKG" "$NOTARY_APP_PASSWORD"

    - name: get environment variables
      id: get_env_var
      run: |
         echo "OUTSET_VERSION=$(/bin/cat ./build_info.txt)" >> $GITHUB_ENV
         echo "OUTSET_MAIN_VERSION=$(/bin/cat ./build_info_main.txt)" >> $GITHUB_ENV

    - name: Generate changelog
      id: changelog
      uses: metcalfc/changelog-generator@v4
      with:
        myToken: ${{ secrets.GITHUB_TOKEN }}
        reverse: 'true'

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        name: Outset ${{env.OUTSET_VERSION}}
        tag_name: v${{env.OUTSET_VERSION}}
        draft: true
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
            # Notes
            This is a version of Outset created by GitHub Actions.
            Outset.app has been signed and notarized. The package has been signed, notarized and stapled.

            # Changelog
            ${{ steps.changelog.outputs.changelog }}
        files: ${{github.workspace}}/outputs/*.pkg

    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: outputs/
